name: Deploy component registry to GitHub Pages

# Regenerates docs/r/ from src/ on every push to main (not just whatever was
# last committed under docs/), so the published registry can't drift out of
# sync with a forgotten `npm run build:registry` before a push. See
# scripts/build-registry.js and README.md's "Installing components via the
# registry" section.
#
# Also exports the on-device Storybook itself to a static site
# (`npm run build:web`, i.e. `expo export --platform web`) and merges it
# into docs/ alongside the registry, so Pages serves a browsable component
# gallery (with a per-component "Install" panel) instead of just raw JSON.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel one that's already live-deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:registry

      - run: npm run build:web

      # dist/ (Expo's web export output) has no r/ folder, so this can't
      # clobber what build:registry just wrote to docs/r/.
      - run: cp -r dist/. docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
